name: Publish handover release

on:
  push:
    tags:
      - "handover-*"
      - "release-request-handover-*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged handover index
        uses: actions/checkout@v4

      - name: Select handover release tag
        id: release
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#release-request-}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ExcavatorVLA Project Handover (2026-07-23)" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ExcavatorVLA Project Handover (2026-07-23)" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Publish success confirmation
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          confirmation_tag="release-confirmed-$RELEASE_TAG"
          git tag "$confirmation_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$confirmation_tag"
