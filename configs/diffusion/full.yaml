# Paths are relative to this file. Batch size is per GPU.
dataset:
  repo_id: local/excavator
  root: ../../../data/export
  episodes: null
  video_backend: pyav
policy:
  type: diffusion
  device: cuda
  n_obs_steps: 1
  horizon: 16
  n_action_steps: 3
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  use_group_norm: false
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  num_train_timesteps: 100
  num_inference_steps: 100
  do_mask_loss_for_padding: true
  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: MEAN_STD
    ACTION: MEAN_STD
  optimizer_lr: 0.0001
  optimizer_weight_decay: 0.000001
steps: 40000
batch_size: 8
num_workers: 8
seed: 1000
save_freq: 5000
log_freq: 200
grad_clip_norm: 10.0
job_name: excavator_diffusion
output_dir: null
benchmark:
  split_file: ../splits/excavator_v4_seed1000.json
  split_seed: 1000
  validation_freq: 5000
  validation_max_batches: 0
launcher:
  output_root: ../../../outputs/train
  hf_home: ../../../models/hf-cache
  torch_home: ../../../models/torch-cache
  gpu_ids: [0, 1]
  mixed_precision: bf16
  cpu_threads: 4
