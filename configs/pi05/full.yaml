dataset:
  repo_id: local/excavator
  root: ../../../data/export
  episodes: null
  video_backend: pyav
assets:
  base_path: ../../../models/pi05_base
  base_sha256: 0eb11ca9587678c1d2ef8cf32807c29f8ce53a2bfdfc1aa4a4c96f16fca59b0f
  tokenizer_path: ../../../models/pi05_tokenizer
policy:
  type: pi05
  device: cuda
  dtype: bfloat16 # Frozen backbone initialization, NOT trainable parameter storage.
  n_obs_steps: 1
  chunk_size: 10
  n_action_steps: 3
  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  empty_cameras: 0
  tokenizer_max_length: 200
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES
  freeze_vision_encoder: true
  train_expert_only: true
  gradient_checkpointing: true
  compile_model: false
  num_inference_steps: 10
  optimizer_lr: 0.000025
  optimizer_betas: [0.9, 0.95]
  optimizer_eps: 0.00000001
  optimizer_weight_decay: 0.01
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 40000
  scheduler_decay_lr: 0.0000025
training:
  trainable_dtype: float32 # Expert, projections, gradients and AdamW moments.
  gradient_accumulation_steps: 8
  validation_batch_size: 1
  resume: null
  keep_checkpoints: 2
steps: 40000
batch_size: 1 # Per GPU. Two GPUs * micro-batch 1 * accumulation 8 = 16.
num_workers: 2
seed: 1000
save_freq: 5000
log_freq: 100
grad_clip_norm: 1.0
job_name: excavator_pi05_expert
output_dir: null
benchmark:
  split_file: ../splits/excavator_v4_seed1000.json
  split_seed: 1000
  validation_freq: 5000
  validation_max_batches: 0
launcher:
  output_root: ../../../outputs/train
  hf_home: ../../../models/hf-cache
  torch_home: ../../../models/torch-cache
  gpu_ids: [0, 1]
  mixed_precision: bf16
  cpu_threads: 4
